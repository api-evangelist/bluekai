name: BlueKai
description: >-
  BlueKai was a data management platform (DMP) and third-party audience data
  marketplace founded in 2008 that let marketers collect, organize, and activate
  first- and third-party audience data for programmatic advertising and
  targeting. Oracle acquired BlueKai in 2014 and folded it into the Oracle Data
  Cloud; Oracle wound down its advertising business (including the former BlueKai
  and Data Cloud assets) in 2024. The company operates no independent developer
  program today — the bluekai.com domain 301-redirects to Oracle's advertising
  pages and exposes no live public API surface. This profile is retained as a
  historical/defunct provider record in the API Evangelist network.
